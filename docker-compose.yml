version: "3.8"

services:
  db:
    image: postgres:16
    container_name: labtest_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: w1903042
      POSTGRES_DB: labtest_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: labtest_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: w1903042
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
